name: check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shell:
    name: Shell checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$HOME/.local/bin"
      - name: Test script behavior
        run: bash scripts/test-scripts.sh
      - name: Test dotfile deployment
        run: bash scripts/test-chezmoi.sh
      - name: Run checks
        run: scripts/check.sh

  macos:
    name: macOS preference checks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n scripts/macos-defaults.sh scripts/assert-macos-preferences.sh scripts/export-macos-preferences.sh
      - name: Dry-run macOS defaults
        run: scripts/macos-defaults.sh --dry-run
      - name: Apply managed macOS defaults
        run: scripts/macos-defaults.sh
      - name: Assert managed macOS defaults
        run: scripts/assert-macos-preferences.sh

  linux-install:
    name: Linux install (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, debian:bookworm]
    steps:
      - uses: actions/checkout@v4
      - name: Build clean integration image
        run: docker build --build-arg BASE_IMAGE=${{ matrix.image }} -f Containerfile.integration -t dotfiles-integration .
      - name: Test fresh install, repeat setup, and updates
        run: docker run --rm dotfiles-integration

  windows-syntax:
    name: PowerShell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }

  portable-tools:
    name: Portable tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v4
      - name: Test unprivileged tools, repeat setup, and fresh-shell activation
        run: bash scripts/test-tools.sh
